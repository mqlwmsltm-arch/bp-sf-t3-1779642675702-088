<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="474" cy="465" r="74" fill="#047857" opacity="0.17"/>
    <circle cx="571" cy="223" r="56" fill="#047857" opacity="0.13"/>
    <circle cx="607" cy="662" r="71" fill="#047857" opacity="0.12"/>
    <circle cx="878" cy="106" r="57" fill="#047857" opacity="0.07"/>
    <circle cx="1190" cy="670" r="46" fill="#047857" opacity="0.18"/>
    <circle cx="501" cy="488" r="35" fill="#047857" opacity="0.14"/>
    <rect x="-43" y="233" width="84" height="79" rx="8" fill="#059669" opacity="0.09" transform="rotate(20, 448, 532)"/>
    <rect x="391" y="65" width="81" height="40" rx="8" fill="#059669" opacity="0.10" transform="rotate(9, 1255, 83)"/>
    <rect x="576" y="57" width="52" height="63" rx="8" fill="#059669" opacity="0.08" transform="rotate(12, 16, 513)"/>
    <rect x="736" y="211" width="37" height="28" rx="8" fill="#059669" opacity="0.12" transform="rotate(27, 25, 271)"/>
    <rect x="361" y="-30" width="32" height="21" rx="8" fill="#059669" opacity="0.10" transform="rotate(17, -92, 635)"/>
    <rect x="1088" y="665" width="44" height="44" rx="8" fill="#059669" opacity="0.10" transform="rotate(2, 50, 126)"/>
    <rect x="913" y="-70" width="87" height="73" rx="8" fill="#059669" opacity="0.14" transform="rotate(31, 1205, 110)"/>
    <rect x="1258" y="463" width="58" height="68" rx="8" fill="#059669" opacity="0.05" transform="rotate(12, 150, 218)"/>
    <polygon points="450,532 493,618 407,618" fill="#047857" opacity="0.13"/>
    <polygon points="-60,366 19,524 -139,524" fill="#047857" opacity="0.12"/>
    <polygon points="57,454 149,638 -35,638" fill="#047857" opacity="0.09"/>
    <polygon points="1299,-113 1383,55 1215,55" fill="#047857" opacity="0.03"/>

  <!-- Wave at bottom -->
  <path d="M0,586 C360,608 840,564 1200,586 L1200,630 L0,630Z" fill="#047857" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 셔츠룸
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 주식투자
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#34d399" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 마포 셔츠룸 — 주식투자
  </text>
</svg>